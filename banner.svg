<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071b30" />
      <stop offset="50%" stop-color="#020a14" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00e5ff" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Electric Circuit Line Gradient -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Ambient Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0055ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Inter:wght@500;700&amp;family=Fira+Code:wght@500;700&amp;display=swap');
    
    .name-title {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#textShimmer);
    }
    
    .role-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 6px;
      fill: #00e5ff;
    }

    .badge-txt {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #7dd3fc;
    }

    .console-txt {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }

    /* CSS Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes scanline {
      0% { transform: translateX(-150px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateX(850px); opacity: 0; }
    }

    @keyframes flowDash {
      to { stroke-dashoffset: -100; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.2; }
    }

    .status-dot {
      animation: blink 1.5s infinite ease-in-out;
    }

    .floating-group {
      animation: floatSlow 5s infinite ease-in-out;
      transform-origin: center;
    }

    .scan-beam {
      animation: scanline 4s infinite linear;
    }

    .circuit-stream {
      stroke-dasharray: 8, 12;
      animation: flowDash 2.5s infinite linear;
    }

    .circuit-stream-reverse {
      stroke-dasharray: 6, 14;
      animation: flowDash 3s infinite linear reverse;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="440" fill="url(#bgGrad)" />
  <rect width="1200" height="440" fill="url(#cyberGrid)" />

  <!-- Animated Breathing Aura in Center -->
  <circle cx="600" cy="220" r="280" fill="url(#auraGlow)">
    <animate attributeName="r" values="240;310;240" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Ambient Particles (Fondo estelar dinámico) -->
  <g fill="#00e5ff" opacity="0.6">
    <circle cx="100" cy="380" r="1.5"><animate attributeName="cy" values="380;40;380" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="350" r="2"><animate attributeName="cy" values="350;60;350" dur="18s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="400" r="1.5"><animate attributeName="cy" values="400;30;400" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="360" r="2.5"><animate attributeName="cy" values="360;50;360" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Animated Molecular / Circuit Lines -->
  <g fill="none" stroke="url(#electricGrad)" stroke-width="1.6" filter="url(#softGlow)">
    <!-- Circuit Paths Left -->
    <path d="M 50 140 L 160 140 L 220 220 L 320 220" class="circuit-stream" />
    <path d="M 120 340 L 200 280 L 280 280 L 330 230" class="circuit-stream-reverse" />
    <path d="M 90 80 L 200 80 L 260 160" class="circuit-stream" />

    <!-- Circuit Paths Right -->
    <path d="M 1150 140 L 1040 140 L 980 220 L 880 220" class="circuit-stream-reverse" />
    <path d="M 1080 340 L 1000 280 L 920 280 L 870 230" class="circuit-stream" />
    <path d="M 1110 80 L 1000 80 L 940 160" class="circuit-stream-reverse" />
  </g>

  <!-- Glowing Nodes with Expansion Waves -->
  <g fill="#00e5ff" filter="url(#superGlow)">
    <!-- Left Nodes -->
    <circle cx="160" cy="140" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="220" r="5"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="280" r="4"><animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/></circle>

    <!-- Right Nodes -->
    <circle cx="1040" cy="140" r="4"><animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="220" r="5"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="280" r="4"><animate attributeName="r" values="3;6;3" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Central Floating Glass Card -->
  <g class="floating-group">
    <!-- Card Base with Glassmorphism -->
    <g filter="url(#superGlow)">
      <rect x="230" y="90" width="740" height="240" rx="22" fill="#020b18" fill-opacity="0.82" stroke="#00e5ff" stroke-width="1.8" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Scanner Laser Beam running horizontally inside Card -->
    <g clip-path="url(#cardClip)">
      <rect x="230" y="90" width="100" height="240" fill="url(#laserGrad)" class="scan-beam" />
    </g>

    <clipPath id="cardClip">
      <rect x="230" y="90" width="740" height="240" rx="22" />
    </clipPath>

    <!-- Futuristic Corner Tech Accents -->
    <path d="M 245 118 L 245 104 L 259 104" fill="none" stroke="#00e5ff" stroke-width="3" />
    <path d="M 955 118 L 955 104 L 941 104" fill="none" stroke="#00e5ff" stroke-width="3" />
    <path d="M 245 302 L 245 316 L 259 316" fill="none" stroke="#00e5ff" stroke-width="3" />
    <path d="M 955 302 L 955 316 L 941 316" fill="none" stroke="#00e5ff" stroke-width="3" />

    <!-- Top Badge (Live Status) -->
    <g transform="translate(485, 114)">
      <rect width="230" height="24" rx="12" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-opacity="0.4" />
      <!-- Pulsing Dot -->
      <circle cx="16" cy="12" r="4.5" fill="#00e5ff" class="status-dot" />
      <circle cx="16" cy="12" r="8" fill="none" stroke="#00e5ff" stroke-opacity="0.6">
        <animate attributeName="r" values="4;11;4" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="16" class="badge-txt" fill="#38bdf8">SYSTEM ACTIVE • ONLINE</text>
    </g>

    <!-- Main Name Title with Shimmer -->
    <text x="600" y="185" text-anchor="middle" class="name-title" filter="url(#softGlow)">
      LINO ENRIQUE SÁNCHEZ
    </text>

    <!-- Tech Divider Line with Pulse Glow -->
    <line x1="360" y1="208" x2="840" y2="208" stroke="url(#electricGrad)" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </line>

    <!-- Role Subtitle -->
    <text x="600" y="240" text-anchor="middle" class="role-title">
      FULL STACK SOFTWARE ENGINEER
    </text>

    <!-- Tech Stack Interactive Pills -->
    <g transform="translate(325, 268)">
      <!-- Pill 1: FastAPI -->
      <g>
        <rect x="0" y="0" width="120" height="28" rx="7" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="60" y="18" text-anchor="middle" class="badge-txt">⚡ FastAPI</text>
      </g>

      <!-- Pill 2: Vue.js 3 -->
      <g transform="translate(132, 0)">
        <rect x="0" y="0" width="120" height="28" rx="7" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="60" y="18" text-anchor="middle" class="badge-txt">✨ Vue.js 3</text>
      </g>

      <!-- Pill 3: Docker -->
      <g transform="translate(264, 0)">
        <rect x="0" y="0" width="120" height="28" rx="7" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="60" y="18" text-anchor="middle" class="badge-txt">🐳 Docker</text>
      </g>

      <!-- Pill 4: GIS / Leaflet -->
      <g transform="translate(396, 0)">
        <rect x="0" y="0" width="154" height="28" rx="7" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="77" y="18" text-anchor="middle" class="badge-txt">🗺️ GIS / Leaflet</text>
      </g>
    </g>
  </g>

  <!-- Bottom Console Status Line -->
  <g transform="translate(600, 395)">
    <text x="0" y="0" text-anchor="middle" class="console-txt">
      &lt; INNOVATE • CODE • SCALE /&gt;
    </text>
  </g>
</svg>
