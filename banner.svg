<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#081b33" />
      <stop offset="45%" stop-color="#030c18" />
      <stop offset="100%" stop-color="#01050a" />
    </radialGradient>

    <!-- Glow & Aura Gradients -->
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0077ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Accents -->
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d5f7ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Pattern Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&amp;family=Inter:wght@400;600;700&amp;family=Fira+Code:wght@500&amp;display=swap');
    .title-name { font-family: 'Orbitron', -apple-system, sans-serif; font-size: 36px; font-weight: 900; letter-spacing: 5px; fill: url(#textGrad); }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 6px; fill: #00e5ff; }
    .badge-text { font-family: 'Fira Code', monospace; font-size: 12px; fill: #7dd3fc; letter-spacing: 2px; }
    .tag-text { font-family: 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="210" r="300" fill="url(#cyanAura)">
    <animate attributeName="r" values="280;320;280" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="150" r="180" fill="url(#blueAura)" />
  <circle cx="1000" cy="260" r="180" fill="url(#blueAura)" />

  <!-- Cybernetic Grid & Node Network -->
  <g stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.3">
    <!-- Lines -->
    <line x1="80" y1="120" x2="220" y2="90"><animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="220" y1="90" x2="340" y2="180"><animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="220" y1="90" x2="160" y2="280"><animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/></line>
    <line x1="160" y1="280" x2="280" y2="340"><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/></line>
    
    <line x1="860" y1="180" x2="980" y2="100"><animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="980" y1="100" x2="1120" y2="140"><animate attributeName="stroke-opacity" values="0.7;0.2;0.7" dur="3.8s" repeatCount="indefinite"/></line>
    <line x1="980" y1="100" x2="1040" y2="280"><animate attributeName="stroke-opacity" values="0.1;0.8;0.1" dur="4.6s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="280" x2="920" y2="330"><animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="5.2s" repeatCount="indefinite"/></line>
  </g>

  <!-- Animated Glowing Energy Nodes -->
  <g fill="#00e5ff" filter="url(#neonGlow)">
    <circle cx="80" cy="120" r="5" />
    <circle cx="220" cy="90" r="6"><animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="280" r="5" />
    <circle cx="280" cy="340" r="4" />
    <circle cx="340" cy="180" r="7"><animate attributeName="r" values="6;9;6" dur="4s" repeatCount="indefinite"/></circle>
    
    <circle cx="860" cy="180" r="7"><animate attributeName="r" values="6;9;6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="100" r="6"><animate attributeName="r" values="5;8;5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="140" r="5" />
    <circle cx="1040" cy="280" r="6" />
    <circle cx="920" cy="330" r="4" />
  </g>

  <!-- Traveling Particles -->
  <circle r="3" fill="#ffffff" filter="url(#softGlow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M80 120 L220 90 L340 180" />
  </circle>
  <circle r="3" fill="#ffffff" filter="url(#softGlow)">
    <animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M1120 140 L980 100 L860 180" />
  </circle>

  <!-- Central Glassmorphism Card -->
  <g filter="url(#softGlow)">
    <rect x="230" y="90" width="740" height="230" rx="20" fill="#030d1a" fill-opacity="0.75" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 245 115 L 245 102 L 258 102" fill="none" stroke="#00e5ff" stroke-width="2.5" />
  <path d="M 955 115 L 955 102 L 942 102" fill="none" stroke="#00e5ff" stroke-width="2.5" />
  <path d="M 245 295 L 245 308 L 258 308" fill="none" stroke="#00e5ff" stroke-width="2.5" />
  <path d="M 955 295 L 955 308 L 942 308" fill="none" stroke="#00e5ff" stroke-width="2.5" />

  <!-- Top Terminal Badge -->
  <g transform="translate(480, 112)">
    <rect width="240" height="24" rx="12" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.3" />
    <circle cx="15" cy="12" r="4" fill="#00e5ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="30" y="16" class="tag-text">SYSTEM STATUS: ONLINE</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="185" text-anchor="middle" class="title-name" filter="url(#softGlow)">
    LINO ENRIQUE SÁNCHEZ
  </text>

  <!-- Cyber Divider Line -->
  <rect x="350" y="205" width="500" height="2" fill="url(#cyberLine)" />

  <!-- Professional Subtitle -->
  <text x="600" y="240" text-anchor="middle" class="subtitle">
    FULL STACK SOFTWARE ENGINEER
  </text>

  <!-- Tech Tags Pill Array -->
  <g transform="translate(340, 265)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#0c2340" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="55" y="17" text-anchor="middle" class="tag-text">⚡ FastAPI</text>

    <!-- Pill 2 -->
    <rect x="125" y="0" width="105" height="26" rx="6" fill="#0c2340" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="177" y="17" text-anchor="middle" class="tag-text">✨ Vue 3</text>

    <!-- Pill 3 -->
    <rect x="245" y="0" width="110" height="26" rx="6" fill="#0c2340" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="300" y="17" text-anchor="middle" class="tag-text">🐳 Docker</text>

    <!-- Pill 4 -->
    <rect x="370" y="0" width="145" height="26" rx="6" fill="#0c2340" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="442" y="17" text-anchor="middle" class="tag-text">🗺️ GIS / Leaflet</text>
  </g>

  <!-- Bottom Terminal Action Line -->
  <text x="600" y="375" text-anchor="middle" class="badge-text" opacity="0.8">
    &lt; CRAFTING RESILIENT ARCHITECTURES &amp; SCALABLE APIS /&gt;
  </text>
</svg>
