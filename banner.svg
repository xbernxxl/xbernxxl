<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 480"
     width="1200"
     height="480">

  <defs>

    <!-- =========================================================
         BACKGROUND
    ========================================================== -->

    <linearGradient id="background"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#010611"/>
      <stop offset="45%" stop-color="#06152b"/>
      <stop offset="100%" stop-color="#020714"/>

    </linearGradient>


    <!-- =========================================================
         MOLECULE GRADIENT
    ========================================================== -->

    <radialGradient id="nodeGradient">

      <stop offset="0%"
            stop-color="#ffffff"/>

      <stop offset="35%"
            stop-color="#67e8f9"/>

      <stop offset="100%"
            stop-color="#00bfff"
            stop-opacity="0"/>

    </radialGradient>


    <!-- =========================================================
         GLOW
    ========================================================== -->

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
          stdDeviation="5"
          result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <filter id="strongGlow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%">

      <feGaussianBlur
          stdDeviation="12"
          result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- =========================================================
         MOLECULE CONNECTION
    ========================================================== -->

    <linearGradient id="connection"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#00e5ff"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#00e5ff"
            stop-opacity="0.7"/>

      <stop offset="100%"
            stop-color="#38bdf8"
            stop-opacity="0"/>

    </linearGradient>


    <!-- =========================================================
         CENTRAL SHINE
    ========================================================== -->

    <radialGradient id="centerGlow">

      <stop offset="0%"
            stop-color="#00e5ff"
            stop-opacity="0.20"/>

      <stop offset="50%"
            stop-color="#0077ff"
            stop-opacity="0.08"/>

      <stop offset="100%"
            stop-color="#001020"
            stop-opacity="0"/>

    </radialGradient>

  </defs>


  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <rect
      width="1200"
      height="480"
      fill="url(#background)"/>


  <!-- CENTRAL ATMOSPHERIC GLOW -->

  <circle
      cx="600"
      cy="250"
      r="260"
      fill="url(#centerGlow)">

    <animate
        attributeName="r"
        values="230;280;230"
        dur="7s"
        repeatCount="indefinite"/>

    <animate
        attributeName="opacity"
        values="0.5;1;0.5"
        dur="6s"
        repeatCount="indefinite"/>

  </circle>


  <!-- =========================================================
       MOLECULAR NETWORK
  ========================================================== -->

  <g fill="none"
     stroke="url(#connection)"
     stroke-width="1.2">


    <!-- LEFT NETWORK -->

    <line x1="70" y1="110" x2="180" y2="180">
      <animate
          attributeName="stroke-opacity"
          values="0.15;0.7;0.15"
          dur="4s"
          repeatCount="indefinite"/>
    </line>

    <line x1="180" y1="180" x2="120" y2="310">
      <animate
          attributeName="stroke-opacity"
          values="0.7;0.15;0.7"
          dur="5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="180" y1="180" x2="310" y2="130">
      <animate
          attributeName="stroke-opacity"
          values="0.2;0.65;0.2"
          dur="3.8s"
          repeatCount="indefinite"/>
    </line>

    <line x1="310" y1="130" x2="350" y2="260">
      <animate
          attributeName="stroke-opacity"
          values="0.6;0.1;0.6"
          dur="4.5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="120" y1="310" x2="260" y2="370">
      <animate
          attributeName="stroke-opacity"
          values="0.15;0.6;0.15"
          dur="4.2s"
          repeatCount="indefinite"/>
    </line>


    <!-- CENTER NETWORK -->

    <line x1="310" y1="130" x2="500" y2="190">
      <animate
          attributeName="stroke-opacity"
          values="0.15;0.8;0.15"
          dur="4s"
          repeatCount="indefinite"/>
    </line>

    <line x1="350" y1="260" x2="500" y2="190">
      <animate
          attributeName="stroke-opacity"
          values="0.7;0.1;0.7"
          dur="5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="350" y1="260" x2="520" y2="330">
      <animate
          attributeName="stroke-opacity"
          values="0.15;0.65;0.15"
          dur="4.5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="500" y1="190" x2="650" y2="250">
      <animate
          attributeName="stroke-opacity"
          values="0.6;0.1;0.6"
          dur="3.5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="520" y1="330" x2="650" y2="250">
      <animate
          attributeName="stroke-opacity"
          values="0.1;0.7;0.1"
          dur="4.8s"
          repeatCount="indefinite"/>
    </line>


    <!-- RIGHT NETWORK -->

    <line x1="650" y1="250" x2="800" y2="150">
      <animate
          attributeName="stroke-opacity"
          values="0.2;0.7;0.2"
          dur="4s"
          repeatCount="indefinite"/>
    </line>

    <line x1="650" y1="250" x2="820" y2="330">
      <animate
          attributeName="stroke-opacity"
          values="0.7;0.1;0.7"
          dur="5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="800" y1="150" x2="950" y2="100">
      <animate
          attributeName="stroke-opacity"
          values="0.1;0.6;0.1"
          dur="4.2s"
          repeatCount="indefinite"/>
    </line>

    <line x1="800" y1="150" x2="900" y2="250">
      <animate
          attributeName="stroke-opacity"
          values="0.6;0.1;0.6"
          dur="3.8s"
          repeatCount="indefinite"/>
    </line>

    <line x1="820" y1="330" x2="980" y2="350">
      <animate
          attributeName="stroke-opacity"
          values="0.15;0.65;0.15"
          dur="4.6s"
          repeatCount="indefinite"/>
    </line>

    <line x1="900" y1="250" x2="1050" y2="200">
      <animate
          attributeName="stroke-opacity"
          values="0.7;0.1;0.7"
          dur="5s"
          repeatCount="indefinite"/>
    </line>

    <line x1="980" y1="350" x2="1120" y2="300">
      <animate
          attributeName="stroke-opacity"
          values="0.1;0.7;0.1"
          dur="4s"
          repeatCount="indefinite"/>
    </line>

  </g>


  <!-- =========================================================
       ENERGY PARTICLES
  ========================================================== -->

  <g fill="#67e8f9"
     filter="url(#softGlow)">


    <!-- PARTICLE 1 -->

    <circle r="3">

      <animateMotion
          dur="4s"
          repeatCount="indefinite"
          path="M70 110 L180 180 L310 130 L500 190 L650 250"/>

    </circle>


    <!-- PARTICLE 2 -->

    <circle r="2.5">

      <animateMotion
          dur="5s"
          begin="1s"
          repeatCount="indefinite"
          path="M120 310 L260 370 L350 260 L520 330 L650 250"/>

    </circle>


    <!-- PARTICLE 3 -->

    <circle r="3">

      <animateMotion
          dur="5.5s"
          begin="2s"
          repeatCount="indefinite"
          path="M650 250 L800 150 L950 100 L900 250 L1050 200"/>

    </circle>


    <!-- PARTICLE 4 -->

    <circle r="2">

      <animateMotion
          dur="6s"
          begin="0.5s"
          repeatCount="indefinite"
          path="M650 250 L820 330 L980 350 L1120 300"/>

    </circle>

  </g>


  <!-- =========================================================
       MOLECULAR NODES
  ========================================================== -->

  <g fill="url(#nodeGradient)"
     filter="url(#strongGlow)">


    <!-- LEFT -->

    <circle cx="70" cy="110" r="8">

      <animate
          attributeName="r"
          values="6;10;6"
          dur="3s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="180" cy="180" r="10">

      <animate
          attributeName="r"
          values="8;13;8"
          dur="4s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="120" cy="310" r="7">

      <animate
          attributeName="r"
          values="5;9;5"
          dur="3.5s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="310" cy="130" r="9">

      <animate
          attributeName="r"
          values="7;12;7"
          dur="4.2s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="350" cy="260" r="8">

      <animate
          attributeName="r"
          values="6;11;6"
          dur="3.8s"
          repeatCount="indefinite"/>

    </circle>


    <!-- CENTER -->

    <circle cx="500" cy="190" r="11">

      <animate
          attributeName="r"
          values="8;14;8"
          dur="3.5s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="520" cy="330" r="8">

      <animate
          attributeName="r"
          values="6;11;6"
          dur="4.5s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="650" cy="250" r="14">

      <animate
          attributeName="r"
          values="10;18;10"
          dur="4s"
          repeatCount="indefinite"/>

    </circle>


    <!-- RIGHT -->

    <circle cx="800" cy="150" r="9">

      <animate
          attributeName="r"
          values="7;12;7"
          dur="3.7s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="820" cy="330" r="8">

      <animate
          attributeName="r"
          values="6;11;6"
          dur="4.2s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="950" cy="100" r="7">

      <animate
          attributeName="r"
          values="5;9;5"
          dur="3.2s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="900" cy="250" r="9">

      <animate
          attributeName="r"
          values="6;12;6"
          dur="4.7s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="980" cy="350" r="8">

      <animate
          attributeName="r"
          values="6;10;6"
          dur="3.9s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="1050" cy="200" r="7">

      <animate
          attributeName="r"
          values="5;9;5"
          dur="4.3s"
          repeatCount="indefinite"/>

    </circle>

    <circle cx="1120" cy="300" r="6">

      <animate
          attributeName="r"
          values="4;8;4"
          dur="3.6s"
          repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- =========================================================
       SMALL FLOATING PARTICLES
  ========================================================== -->

  <g fill="#38bdf8"
     opacity="0.6">

    <circle cx="40" cy="420" r="2">
      <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; 40 -25; 0 0"
          dur="8s"
          repeatCount="indefinite"/>
    </circle>

    <circle cx="250" cy="80" r="2">
      <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; -25 30; 0 0"
          dur="7s"
          repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="80" r="2">
      <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; 35 25; 0 0"
          dur="9s"
          repeatCount="indefinite"/>
    </circle>

    <circle cx="1160" cy="100" r="2">
      <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; -30 40; 0 0"
          dur="8s"
          repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- =========================================================
       CENTRAL TEXT BACKDROP
  ========================================================== -->

  <rect
      x="230"
      y="145"
      width="740"
      height="135"
      rx="25"
      fill="#020b18"
      fill-opacity="0.62"/>


  <rect
      x="230"
      y="145"
      width="740"
      height="135"
      rx="25"
      fill="none"
      stroke="#00e5ff"
      stroke-opacity="0.15">

    <animate
        attributeName="stroke-opacity"
        values="0.08;0.35;0.08"
        dur="4s"
        repeatCount="indefinite"/>

  </rect>


  <!-- =========================================================
       NAME
  ========================================================== -->

  <text
      x="600"
      y="205"
      text-anchor="middle"
      fill="#e6fbff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="38"
      font-weight="700"
      letter-spacing="4">

    LINO ENRIQUE SÁNCHEZ BERNAL

    <animate
        attributeName="opacity"
        values="0.75;1;0.75"
        dur="4s"
        repeatCount="indefinite"/>

  </text>


  <!-- =========================================================
       PROFESSIONAL TITLE
  ========================================================== -->

  <text
      x="600"
      y="245"
      text-anchor="middle"
      fill="#00e5ff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="22"
      font-weight="600"
      letter-spacing="5">

    FULL STACK SOFTWARE ENGINEER

    <animate
        attributeName="opacity"
        values="0.45;1;0.45"
        dur="3s"
        repeatCount="indefinite"/>

  </text>


  <!-- =========================================================
       BOTTOM STATUS
  ========================================================== -->

  <text
      x="600"
      y="410"
      text-anchor="middle"
      fill="#38bdf8"
      opacity="0.55"
      font-family="monospace"
      font-size="12"
      letter-spacing="3">

    &lt; BUILD • CREATE • INNOVATE /&gt;

    <animate
        attributeName="opacity"
        values="0.25;0.7;0.25"
        dur="5s"
        repeatCount="indefinite"/>

  </text>

</svg>
