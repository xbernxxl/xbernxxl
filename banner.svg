<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#081f38" />
      <stop offset="50%" stop-color="#020a14" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00e5ff" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Electric Circuit Line Gradient -->
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Ambient Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0055ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.06" />
    </pattern>

    <!-- Card ClipPath -->
    <clipPath id="cardClip">
      <rect x="140" y="65" width="920" height="280" rx="24" />
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Inter:wght@600;700&amp;family=Fira+Code:wght@500;700&amp;display=swap');
    
    .name-title {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#textShimmer);
    }
    
    .role-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 7px;
      fill: #00e5ff;
    }

    .badge-txt {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #7dd3fc;
    }

    .status-txt {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #38bdf8;
    }

    .console-txt {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 3px;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes scanline {
      0% { transform: translateX(-150px); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateX(1050px); opacity: 0; }
    }

    @keyframes flowDash {
      to { stroke-dashoffset: -100; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }

    .status-dot {
      animation: blink 1.4s infinite ease-in-out;
    }

    .floating-group {
      animation: floatSlow 5s infinite ease-in-out;
      transform-origin: center;
    }

    .scan-beam {
      animation: scanline 4.5s infinite linear;
    }

    .circuit-stream {
      stroke-dasharray: 8, 12;
      animation: flowDash 2.5s infinite linear;
    }

    .circuit-stream-reverse {
      stroke-dasharray: 6, 14;
      animation: flowDash 3s infinite linear reverse;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="450" fill="url(#bgGrad)" />
  <rect width="1200" height="450" fill="url(#cyberGrid)" />

  <!-- Center Glowing Aura -->
  <circle cx="600" cy="210" r="320" fill="url(#auraGlow)">
    <animate attributeName="r" values="280;340;280" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Particles Background -->
  <g fill="#00e5ff" opacity="0.6">
    <circle cx="80" cy="400" r="1.5"><animate attributeName="cy" values="400;30;400" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="410" r="2"><animate attributeName="cy" values="410;40;410" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Outer Circuits connecting to the enlarged box -->
  <g fill="none" stroke="url(#electricGrad)" stroke-width="1.8" filter="url(#softGlow)">
    <!-- Left Connections -->
    <path d="M 20 120 L 70 120 L 140 180" class="circuit-stream" />
    <path d="M 40 330 L 100 270 L 140 270" class="circuit-stream-reverse" />
    <path d="M 50 60 L 110 60 L 140 100" class="circuit-stream" />

    <!-- Right Connections -->
    <path d="M 1180 120 L 1130 120 L 1060 180" class="circuit-stream-reverse" />
    <path d="M 1160 330 L 1100 270 L 1060 270" class="circuit-stream" />
    <path d="M 1150 60 L 1090 60 L 1060 100" class="circuit-stream-reverse" />
  </g>

  <!-- Energy Nodes -->
  <g fill="#00e5ff" filter="url(#superGlow)">
    <circle cx="70" cy="120" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="270" r="4"><animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="120" r="4"><animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="270" r="4"><animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Central Floating Glass Card (AMPLIADO: 920px ancho x 280px alto) -->
  <g class="floating-group">
    <!-- Card Frame -->
    <g filter="url(#superGlow)">
      <rect x="140" y="65" width="920" height="280" rx="24" fill="#020b18" fill-opacity="0.84" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.55">
        <animate attributeName="stroke-opacity" values="0.35;0.85;0.35" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Scanner Laser inside the larger box -->
    <g clip-path="url(#cardClip)">
      <rect x="140" y="65" width="120" height="280" fill="url(#laserGrad)" class="scan-beam" />
    </g>

    <!-- Corner Accents -->
    <path d="M 158 95 L 158 80 L 173 80" fill="none" stroke="#00e5ff" stroke-width="3" />
    <path d="M 1042 95 L 1042 80 L 1027 80" fill="none" stroke="#00e5ff" stroke-width="3" />
    <path d="M 158 315 L 158 330 L 173 330" fill="none" stroke="#00e5ff" stroke-width="3" />
    <path d="M 1042 315 L 1042 330 L 1027 330" fill="none" stroke="#00e5ff" stroke-width="3" />

    <!-- Status Pill -->
    <g transform="translate(475, 90)">
      <rect width="250" height="26" rx="13" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.4" />
      <circle cx="18" cy="13" r="4.5" fill="#00e5ff" class="status-dot" />
      <circle cx="18" cy="13" r="8" fill="none" stroke="#00e5ff" stroke-opacity="0.6">
        <animate attributeName="r" values="4;11;4" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="17" class="status-txt">SYSTEM ACTIVE • ONLINE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="name-title" filter="url(#softGlow)">
      LINO ENRIQUE SÁNCHEZ
    </text>

    <!-- Divider Line -->
    <line x1="280" y1="190" x2="920" y2="190" stroke="url(#electricGrad)" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </line>

    <!-- Subtitle -->
    <text x="600" y="225" text-anchor="middle" class="role-title">
      FULL STACK SOFTWARE ENGINEER
    </text>

    <!-- Tech Stack Pills Array -->
    <g transform="translate(205, 258)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.3"/>
        <text x="82" y="22" text-anchor="middle" class="badge-txt">⚡ FastAPI / Python</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.3"/>
        <text x="82" y="22" text-anchor="middle" class="badge-txt">✨ Vue 3 / Angular</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="190" height="34" rx="8" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.3"/>
        <text x="95" y="22" text-anchor="middle" class="badge-txt">🗺️ Leaflet / Spatial GIS</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(565, 0)">
        <rect x="0" y="0" width="225" height="34" rx="8" fill="#061c36" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.3"/>
        <text x="112" y="22" text-anchor="middle" class="badge-txt">🐳 Docker &amp; Cloud Systems</text>
      </g>
    </g>
  </g>

  <!-- Bottom Console Status Line -->
  <g transform="translate(600, 405)">
    <text x="0" y="0" text-anchor="middle" class="console-txt">
      &lt; RESILIENT ARCHITECTURES • HIGH CONCURRENCY • VISION &amp; GIS /&gt;
    </text>
  </g>
</svg>
